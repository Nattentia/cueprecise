name: Windows installer

on:
  pull_request:
    paths:
      - "installer/**"
      - "src/**"
      - "pyproject.toml"
      - ".github/workflows/windows-installer.yml"
  workflow_dispatch:
  # 릴리스 워크플로가 같은 빌드와 같은 검사를 그대로 불러 쓴다.
  workflow_call:
    outputs:
      sha256:
        description: "설치 프로그램의 SHA-256 해시"
        value: ${{ jobs.build.outputs.sha256 }}
      mcpb_sha256:
        description: "Claude Desktop MCPB의 SHA-256 해시"
        value: ${{ jobs.build.outputs.mcpb_sha256 }}

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    outputs:
      sha256: ${{ steps.hash.outputs.sha256 }}
      mcpb_sha256: ${{ steps.mcpb_hash.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Build installer
        shell: pwsh
        run: ./installer/build_windows.ps1
      - name: Record installer hash
        id: hash
        shell: pwsh
        run: |
          $installer = "dist/windows/cueprecise-windows.zip"
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $installer).Hash.ToLower()
          "sha256=$hash" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Output $hash
      - name: Build Claude Desktop MCPB
        shell: pwsh
        run: ./installer/mcpb/build_mcpb.ps1
      - name: Record Claude Desktop MCPB hash
        id: mcpb_hash
        shell: pwsh
        run: |
          $bundle = "dist/mcpb/cueprecise-windows.mcpb"
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $bundle).Hash.ToLower()
          "sha256=$hash" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Output $hash
      - name: Assemble release artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/release | Out-Null
          Copy-Item dist/windows/cueprecise-windows.zip dist/release/
          Copy-Item dist/mcpb/cueprecise-windows.mcpb dist/release/
      - name: Smoke-test bundled commands
        shell: pwsh
        run: |
          ./build/windows/release/py/python.exe -m mcp_server --help
          ./build/windows/release/py/python.exe -m yt_dlp --version
          ./build/windows/release/py/ffmpeg.exe -version
          ./build/windows/release/py/ffprobe.exe -version
      # 설치 프로그램이 실제로 하는 일을 격리된 임시 위치에서 확인한다.
      # APPDATA/LOCALAPPDATA/USERPROFILE/CODEX_HOME/CLAUDE_CONFIG_DIR 를 이 단계에서만
      # 바꿔 진짜 Claude 설정과 시작 메뉴는 건드리지 않는다.
      - name: Extract, connect and disconnect from the zip installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $key = "AQ." + ("test" * 8)
          $sandbox = Join-Path $env:RUNNER_TEMP "installcheck"
          $appdata = Join-Path $sandbox "Roaming"
          $localappdata = Join-Path $sandbox "Local"
          $userprofile = Join-Path $sandbox "Profile"
          $codexHome = Join-Path $sandbox "codex-home"
          $claudeConfigDir = Join-Path $sandbox "claude-code-home"
          $claude = Join-Path $appdata "Claude"
          $config = Join-Path $claude "claude_desktop_config.json"
          $extractDir = Join-Path $sandbox "extracted"
          New-Item -ItemType Directory -Force -Path $claude, $userprofile, $codexHome, $claudeConfigDir | Out-Null

          # 이미 등록해 둔 사용자의 설정을 흉내낸다. v0.2.5/v0.2.6 setup.exe 가 남긴 옛
          # cueprecise-mcp.exe 항목이 새 zip 설치본으로 덮어써지는지, 남의 항목은
          # 보존되는지를 함께 본다.
          $existing = @{
            theme = "dark"
            mcpServers = @{
              cueprecise = @{
                command = "C:/Old/CuePrecise/cueprecise-mcp.exe"
                args = @("--bundle-root", (Join-Path $sandbox "olddata"))
                env = @{ GEMINI_API_KEY = $key; PATH = "C:/ffmpeg/bin" }
              }
              other = @{ command = "keep-me"; args = @("--serve") }
            }
          }
          $existing | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath $config -Encoding utf8

          $env:APPDATA = $appdata
          $env:LOCALAPPDATA = $localappdata
          $env:USERPROFILE = $userprofile
          $env:CODEX_HOME = $codexHome
          $env:CLAUDE_CONFIG_DIR = $claudeConfigDir

          Expand-Archive -LiteralPath "dist/windows/cueprecise-windows.zip" -DestinationPath $extractDir
          $cmd = Join-Path $extractDir "CuePrecise 설치.cmd"
          if (-not (Test-Path -LiteralPath $cmd)) { throw "설치 스크립트가 압축에 없다: $cmd" }

          # Claude Desktop 은 이 러너에 설치돼 있지 않지만, 설정 파일을 직접 쓰는
          # 방식이라 외부 CLI 없이 헤드리스로 시험할 수 있다.
          $key | & $cmd --api-key-stdin --targets claude-desktop
          if ($LASTEXITCODE -ne 0) { throw "설치 스크립트가 실패했다 (종료 코드 $LASTEXITCODE)" }

          $saved = Get-Content -LiteralPath $config -Raw | ConvertFrom-Json
          $names = $saved.mcpServers.PSObject.Properties.Name
          if ($names -notcontains "cueprecise") { throw "cueprecise 항목이 만들어지지 않았다" }
          $entry = $saved.mcpServers.cueprecise
          if ($entry.command -notlike "*py/python.exe" -and $entry.command -notlike "*py\python.exe") {
            throw "등록된 명령이 py\python.exe 가 아니다: $($entry.command)"
          }
          if (@($entry.args)[0] -ne "-m" -or @($entry.args)[1] -ne "mcp_server") {
            throw "등록된 인자가 -m mcp_server 로 시작하지 않는다: $($entry.args -join ' ')"
          }
          if ($entry.env.GEMINI_API_KEY) { throw "API 키가 설정에 평문으로 남았다" }
          $credential = $entry.env.CUEPRECISE_GEMINI_CREDENTIAL
          if (-not $credential) { throw "보호된 API 키 경로가 설정에 없다" }
          if (-not (Test-Path -LiteralPath $credential)) { throw "보호된 API 키 파일이 없다" }
          $credentialBytes = [System.IO.File]::ReadAllBytes($credential)
          $credentialText = [System.Text.Encoding]::UTF8.GetString($credentialBytes)
          if ($credentialText.Contains($key)) { throw "보호 파일에 API 키가 평문으로 남았다" }
          if ($saved.mcpServers.other.command -ne "keep-me") { throw "다른 MCP 설정이 훼손됐다" }
          if ($saved.theme -ne "dark") { throw "다른 설정이 훼손됐다" }
          if (@(Get-ChildItem -LiteralPath $claude -Filter "*.bak").Count -lt 1) { throw "백업이 만들어지지 않았다" }
          foreach ($backup in Get-ChildItem -LiteralPath $claude -Filter "*.bak") {
            if ((Get-Content -LiteralPath $backup.FullName -Raw).Contains($key)) {
              throw "설정 백업에 API 키가 남았다"
            }
          }

          & $cmd --uninstall
          if ($LASTEXITCODE -ne 0) { throw "제거 스크립트가 실패했다 (종료 코드 $LASTEXITCODE)" }

          $removed = Get-Content -LiteralPath $config -Raw | ConvertFrom-Json
          $left = $removed.mcpServers.PSObject.Properties.Name
          if ($left -contains "cueprecise") { throw "제거 후에도 cueprecise 항목이 남았다" }
          if ($removed.mcpServers.other.command -ne "keep-me") { throw "제거가 다른 MCP 설정을 지웠다" }
          if (Test-Path -LiteralPath $credential) { throw "제거 후에도 보호된 API 키가 남았다" }
          Write-Output "압축 해제, 연결, 설정 확인, 제거 확인 완료"

      - uses: actions/upload-artifact@v7
        with:
          name: cueprecise-windows-installer
          path: dist/release/*
          if-no-files-found: error
