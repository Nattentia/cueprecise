name: Windows installer

on:
  pull_request:
    paths:
      - "installer/**"
      - "src/**"
      - "pyproject.toml"
      - ".github/workflows/windows-installer.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Build installer
        shell: pwsh
        run: ./installer/build_windows.ps1
      - name: Smoke-test bundled commands
        shell: pwsh
        run: |
          ./dist/windows/cueprecise-mcp.exe --help
          ./dist/windows/yt-dlp.exe --version
      - uses: actions/upload-artifact@v6
        with:
          name: cueprecise-windows-installer
          path: |
            dist/windows/cueprecise-setup.exe
            dist/windows/cueprecise-mcp.exe
          if-no-files-found: error
