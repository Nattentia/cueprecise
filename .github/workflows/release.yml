# 배포 준비를 자동으로 한다. 사람이 하는 일은 두 가지뿐이다.
#   1. GitHub 웹에서 Run workflow 를 누르고 버전을 입력한다.
#   2. 만들어진 초안(draft) 릴리스를 확인하고 Publish 를 누른다.
# 초안 상태에서는 태그도 만들어지지 않고 사용자에게도 보이지 않는다.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "배포할 버전 (예: 0.3.0)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    name: 버전 확인
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      # 0.2.0 때 버전이 박힌 곳을 손으로 고치다 어긋난 적이 있다.
      # 빌드에 3분을 쓰기 전에 여기서 먼저 멈춘다.
      - name: 버전이 네 곳에서 같은지 확인한다
        id: check
        env:
          VERSION: ${{ inputs.version }}
        run: |
          tag="$(python installer/release_version.py "$VERSION")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: 같은 이름의 태그나 릴리스가 이미 있는지 확인한다
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.check.outputs.tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::$TAG 태그가 이미 있다. 이미 배포한 버전이다."
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::$TAG 릴리스가 이미 있다. 남은 초안이면 지우고 다시 실행한다."
            exit 1
          fi

  build:
    name: 설치 프로그램 빌드
    needs: verify
    # PR 에서 도는 것과 똑같은 빌드·설치·제거 검사를 그대로 쓴다.
    uses: ./.github/workflows/windows-installer.yml

  publish:
    name: 초안 릴리스 생성
    needs: [verify, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v6
        with:
          name: cueprecise-windows-installer
          path: artifacts
      # CODE_SIGNING_POLICY.md 는 해시를 함께 게시하도록 정하고 있다.
      # 같은 김에 빌드가 만든 파일이 그대로 왔는지도 확인한다.
      - name: 해시를 확인하고 SHA256SUMS.txt 를 만든다
        env:
          EXPECTED: ${{ needs.build.outputs.sha256 }}
        run: |
          cd artifacts
          actual="$(sha256sum cueprecise-setup.exe | cut -d ' ' -f 1)"
          if [ "$actual" != "$EXPECTED" ]; then
            echo "::error::설치 프로그램 해시가 빌드 결과와 다르다 (빌드 $EXPECTED, 받은 파일 $actual)"
            exit 1
          fi
          mcpb_actual="$(sha256sum cueprecise-windows.mcpb | cut -d ' ' -f 1)"
          if [ "$mcpb_actual" != "${{ needs.build.outputs.mcpb_sha256 }}" ]; then
            echo "::error::Claude MCPB 해시가 빌드 결과와 다르다"
            exit 1
          fi
          printf '%s  cueprecise-setup.exe\n%s  cueprecise-windows.mcpb\n' "$actual" "$mcpb_actual" > SHA256SUMS.txt
          cat SHA256SUMS.txt
      # --draft: 확인하고 Publish 를 누르기 전까지 태그도, 공개도 없다.
      # --prerelease: 코드 서명 심사가 끝나면 이 줄을 뺀다.
      - name: 초안 릴리스를 만든다
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          gh release create "$TAG" \
            --draft \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "CuePrecise $TAG" \
            --generate-notes \
            artifacts/cueprecise-setup.exe \
            artifacts/cueprecise-windows.mcpb \
            artifacts/SHA256SUMS.txt
          echo "### 초안 릴리스를 만들었다: $TAG" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "확인한 뒤 Releases 에서 Publish 를 눌러야 사용자에게 간다." >> "$GITHUB_STEP_SUMMARY"
          gh release view "$TAG" --json url --jq .url >> "$GITHUB_STEP_SUMMARY"
